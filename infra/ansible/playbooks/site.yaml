---
- name: Prepare all nodes
  hosts: k8s_cluster
  become: true
  roles:
    - common

- name: Initialize control plane
  hosts: master
  become: true
  roles:
    - control_plane

- name: Join worker nodes
  hosts: workers
  become: true
  roles:
    - worker

- name: Verify cluster is Ready
  hosts: master
  become: true
  tasks:
    - name: Wait until all nodes are Ready
      become_user: "{{ cluster_user }}"
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=300s
      environment:
        KUBECONFIG: "/home/{{ cluster_user }}/.kube/config"
      timeout: 320
      changed_when: false
