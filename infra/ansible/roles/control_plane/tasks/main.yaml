---
- name: Install kubectl
  ansible.builtin.apt:
    name:
      - "kubectl={{ kubernetes_version }}*"
    state: present
    update_cache: true

- name: Hold kubectl at current version
  ansible.builtin.dpkg_selections:
    name: kubectl
    selection: hold

- name: Check if cluster is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_init_check

- name: Initialize Kubernetes control plane
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --apiserver-advertise-address={{ ansible_host }}
  when: not k8s_init_check.stat.exists

- name: Create kubeconfig directory for cluster user
  ansible.builtin.file:
    path: "/home/{{ cluster_user }}/.kube"
    state: directory
    owner: "{{ cluster_user }}"
    group: "{{ cluster_user }}"
    mode: "0755"

- name: Copy admin.conf to cluster user kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ cluster_user }}/.kube/config"
    remote_src: true
    owner: "{{ cluster_user }}"
    group: "{{ cluster_user }}"
    mode: "0600"

- name: Apply Tigera operator
  become_user: "{{ cluster_user }}"
  ansible.builtin.command: >
    kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
  environment:
    KUBECONFIG: "/home/{{ cluster_user }}/.kube/config"
  register: tigera_apply
  changed_when: "'created' in tigera_apply.stdout or 'configured' in tigera_apply.stdout"

- name: Wait for Tigera Installation CRD
  become_user: "{{ cluster_user }}"
  ansible.builtin.command: kubectl get crd installations.operator.tigera.io
  environment:
    KUBECONFIG: "/home/{{ cluster_user }}/.kube/config"
  register: tigera_crd
  until: tigera_crd.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Download Calico custom-resources manifest
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/custom-resources.yaml"
    dest: /tmp/calico-custom-resources.yaml
    mode: "0644"

- name: Patch Calico CIDR to match pod_network_cidr
  ansible.builtin.replace:
    path: /tmp/calico-custom-resources.yaml
    regexp: '192\.168\.0\.0/16'
    replace: "{{ pod_network_cidr }}"

- name: Apply Calico custom resources
  become_user: "{{ cluster_user }}"
  ansible.builtin.command: kubectl apply -f /tmp/calico-custom-resources.yaml
  environment:
    KUBECONFIG: "/home/{{ cluster_user }}/.kube/config"
  register: calico_apply
  changed_when: "'created' in calico_apply.stdout or 'configured' in calico_apply.stdout"

- name: Generate kubeadm join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_raw
  changed_when: false
