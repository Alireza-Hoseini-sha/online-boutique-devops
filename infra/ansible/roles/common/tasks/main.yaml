---
- name: Disable swap
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap entry from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    line: '# \1'
    backrefs: true

- name: Load kernel modules
  ansible.builtin.command: "modprobe {{ item }}"
  changed_when: false
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Persist sysctl params
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Apply sysctl params
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Install containerd and dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - containerd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Generate default containerd config
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml
  notify: Restart containerd

- name: Enable SystemdCgroup in containerd config
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Assert SystemdCgroup is enabled
  ansible.builtin.command: grep -E '^\s*SystemdCgroup = true' /etc/containerd/config.toml
  changed_when: false

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Kubernetes apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.src
    mode: "0644"
  register: k8s_apt_key

- name: Check for dearmored Kubernetes apt key
  ansible.builtin.stat:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  register: k8s_gpg

- name: Dearmor Kubernetes apt signing key
  ansible.builtin.shell: |
    gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg.tmp \
      /etc/apt/keyrings/kubernetes-apt-keyring.src
    mv /etc/apt/keyrings/kubernetes-apt-keyring.gpg.tmp \
      /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  when: k8s_apt_key.changed or not k8s_gpg.stat.exists

- name: Set Kubernetes apt key permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    mode: "0644"

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
    state: present
    filename: kubernetes
    update_cache: true

- name: Install kubelet and kubeadm
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_version }}*"
      - "kubeadm={{ kubernetes_version }}*"
    state: present
    update_cache: true

- name: Hold Kubernetes node packages at current version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
