---
- name: Check if node already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: k8s_join_check

- name: Fail if join command is missing
  ansible.builtin.fail:
    msg: >-
      No kubeadm join command on the control plane.
      Run playbooks/site.yaml so the control_plane role can publish it.
  when:
    - not k8s_join_check.stat.exists
    - hostvars[groups['master'][0]].join_command_raw is not defined

- name: Join worker to the cluster
  ansible.builtin.command: "{{ hostvars[groups['master'][0]].join_command_raw.stdout | trim }}"
  when: not k8s_join_check.stat.exists
